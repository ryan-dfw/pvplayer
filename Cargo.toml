[package]
name = "pvplay"
version = "0.0.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Plays music videos in mpv, synced to MPD playback"
repository = "https://github.com/ryan-dfw/pvplay"
readme = "readme.md"
publish = false
default-run = "pvplay"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
id3 = "1.17.2"
serde_json = "1.0.151"
